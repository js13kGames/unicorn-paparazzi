<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- No user-scalable=no: maximum-scale=1 covers Android, and Safari has ignored
       both since iOS 10 -- there `touch-action: none` below and the gesturestart
       handler in index.js hold the zoom off. -->
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <!-- The shell is the one part of the archive Roadroller never sees -- it must
       stay parseable HTML -- so every character here costs close to raw bytes.
       Hence no <title> (ui.js sets it, where the words are already paid for) and
       no theme-color (26 bytes for a tinted address bar). Comments are stripped
       at build time, so they are free. -->
  <!-- GitHub Pages only: docs/ is a multi-file site, the jam archive is one
       self-contained file. build/pack.mjs strips both before measuring, so they
       cost the zip nothing; CopyPlugin places what they point at. -->
  <link rel="manifest" href="manifest.json">
  <script>navigator.serviceWorker&&addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js"))</script>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      touch-action: none; overscroll-behavior: none;
      background: #9ce; color: #fff;
      font: 13px/1.45 ui-monospace, monospace;
    }
    #c { display: block; width: 100vw; height: 100vh; cursor: crosshair; border: 0 }
    #ui { position: fixed; inset: 0; pointer-events: none }
    #ui > * { position: absolute }
    .sh { text-shadow: 0 1px 3px #0009 }
    small { font-size: 11px; opacity: .8 }

    #flash { inset: 0; background: #fff; opacity: 0 }
    #hud { top: 8px; left: 10px; font-size: 15px }
    #film { top: 8px; right: 10px; text-align: right; font-size: 17px }
    #film b { font-size: 24px }
    #film.low b { color: #f86 }
    #roll {
      top: 72px; right: 10px; width: 84px; bottom: 46px; gap: 4px;
      display: flex; flex-direction: column-reverse; justify-content: flex-end;
      overflow: hidden;
    }
    #roll img { width: 100%; border: 1px solid #fff6; display: block }

    /* The crosshair as two centred gradient strips rather than two pseudo-elements:
       same 20px cross, far less CSS. */
    #vf {
      border: 1px solid #fff6;
      background: linear-gradient(#fff9, #fff9) center/20px 1px no-repeat,
                  linear-gradient(#fff9, #fff9) center/1px 20px no-repeat;
    }


    #track { left: 10px; right: 10px; bottom: 10px; height: 4px; background: #0004 }
    #bar { height: 100%; width: 0; background: #fff }

    #panel { inset: 0; display: none; place-items: center; background: #421c; pointer-events: auto }
    #panel.on { display: grid }
    /* No fill and no border: the scrim is the background on all five screens, and
       the outlined buttons and .r row rules carry the structure. */
    #card {
      width: min(720px, 92vw); max-height: 88vh; overflow: auto; touch-action: pan-y;
      padding: 18px 20px
    }
    /* The title card is layout only: full width for the 6em face, no scroll (a
       scrollbar gutter would pull the column off centre), and the stacking flex. */
    #card.t {
      width: 100%; padding: 0; overflow: visible;
      display: flex; flex-direction: column; align-items: center
    }
    h1 { font: 700 44px serif; margin: 0 0 10px }
    #card.t h1 { font-size: 6em }
    /* Top margin so stacked result cards do not run into each other. */
    h2 { font-size: 14px; margin: 18px 0 12px; font-weight: 400; color: #c97 }
    h1, h2 { text-align: center }
    #card img { width: 100%; display: block; margin-bottom: 12px; background: #000 }
    table { width: 100%; border-collapse: collapse; font-size: 12px }
    td { padding: 3px 0 }
    /* No tabular-nums: the page is set in a monospace face, so digits already line up. */
    td.n { text-align: right }
    td.i { width: 92px; padding-right: 10px }
    /* The lobby roster is the only row3 call with neither thumbnail nor score, so
       an empty .i cell identifies it -- no class to pass, no second builder.
       Collapsing it centres the name across the whole table. */
    td.i:empty { width: 0; padding: 0 }
    td.i:empty ~ td { text-align: center }
    /* Single letters: each is written out many times over in ui.js. Measured at
       14 bytes, and this legend is stripped before packing, so it is free.
         r rule (a ruled-off row)   d dim      w weak      p positive
         m minus (a loss, or a multiplier below parity)
         h hint (a footer line)     b big      o row (clickable)
         i thumbnail cell (t is taken by the title card)                     */
    tr.o { cursor: pointer }
    tr.o:hover td { background: #fff1 }
    .r td { border-top: 1px solid #fff3; padding-top: 8px }
    .d { color: #b86 }
    .p { color: #9b6 }
    .b { font-size: 17px }
    .h { margin-top: 14px; color: #a76; font-size: 12px; text-align: center }
    /* After .h, so a footer line can take the loss color: `class="h m"` is a
       hint that is also a problem, and .m has to win the tie. */
    .m { color: #f86 }
    /* One control everywhere: an outline on the scrim, filling in on hover. Inputs
       included -- an exception for them cost 14 bytes, and an empty outlined box
       already reads as a field. */
    button, input {
      background: none; color: #fff; border: 1px solid #fff3;
      padding: 10px 16px; font: inherit; cursor: pointer; min-width: 88px
    }
    /* Scoped to the title card, where the buttons are the menu and carry the
       display face the title is set in. */
    .t button { font: 2em serif }
    /* Fills in to its own outline: #fff3 is the border colour it already carries,
       so it is a value the packer has seen three times over. */
    button:hover:not(:disabled) { background: #fff3 }
    button:disabled { opacity: .35; cursor: default }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="flash"></div>
    <div id="hud" class="sh"></div>
    <div id="film" class="sh"></div>
    <div id="roll"></div>
    <div id="vf"></div>
    <div id="track"><div id="bar"></div></div>
    <div id="panel"><div id="card"></div></div>
  </div>
</body>

</html>
