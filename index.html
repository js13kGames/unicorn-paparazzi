<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unicorn Snap</title>
  <meta name="theme-color" content="#9ec7f2">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #9ec7f2;
      color: #fff;
      font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace;
    }

    #c {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #hud {
      position: absolute;
      top: 8px;
      left: 10px;
      text-shadow: 0 1px 2px #0008;
    }

    #track {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 5px;
      background: #0004;
      border-radius: 3px;
    }

    #bar {
      height: 100%;
      width: 0;
      background: #fff;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="hud"></div>
    <div id="track">
      <div id="bar"></div>
    </div>
  </div>
</body>

</html>
