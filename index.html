<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Unicorn Paparazzi</title>
  <meta name="theme-color" content="#9ec7f2">
  <style>
    /* Deliberately lean: this stylesheet rides inside the compressed payload,
       and unique prose is the one thing the packer cannot squeeze. */
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      touch-action: none; overscroll-behavior: none;
      background: #9ec7f2; color: #fff;
      font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace;
    }
    #c { display: block; width: 100vw; height: 100vh; cursor: crosshair }
    #ui { position: fixed; inset: 0; pointer-events: none }
    #ui > * { position: absolute }
    .sh { text-shadow: 0 1px 3px #0009 }
    small { font-size: 11px; opacity: .8 }

    #flash { inset: 0; background: #fff; opacity: 0 }
    #hud { top: 8px; left: 10px }
    #film { top: 8px; right: 10px; text-align: right; font-size: 15px }
    #film b { font-size: 22px }
    #film.low b { color: #ff8f6b }
    #roll {
      top: 60px; right: 10px; width: 84px; bottom: 46px; gap: 4px;
      display: flex; flex-direction: column-reverse; justify-content: flex-end;
      overflow: hidden;
    }
    #roll img { width: 100%; border: 1px solid #fff6; display: block }

    #vf { border: 1px solid #fff6 }
    #vf::before, #vf::after {
      content: ''; position: absolute; left: 50%; top: 50%; background: #fff9
    }
    #vf::before { width: 20px; height: 1px; margin-left: -10px }
    #vf::after { width: 1px; height: 20px; margin-top: -10px }


    #track { left: 10px; right: 10px; bottom: 10px; height: 4px; background: #0004 }
    #bar { height: 100%; width: 0; background: #fff }

    #panel { inset: 0; display: none; place-items: center; background: #ff8f6bb3; pointer-events: auto }
    #panel.on { display: grid }
    #card {
      width: min(720px, 92vw); max-height: 88vh; overflow: auto; touch-action: pan-y;
      background: #16273b; border: 1px solid #ffffff26; padding: 18px 20px
    }
    #card.t {
      background: none; border: 0; width: 100vw;
      display: flex; flex-direction: column; align-items: center
    }
    h1 { font: 700 44px serif; margin: 0 0 10px }
    #card.t h1 { font-size: 6em; animation: w 1s infinite }
    @keyframes w { 50% { transform: translateY(-20px) } }
    /* Top margin so stacked result cards do not run into each other. */
    h2 { font-size: 14px; margin: 18px 0 12px; font-weight: 400; color: #9fb6cc }
    h1, h2 { text-align: center }
    #card img { width: 100%; display: block; margin-bottom: 12px; background: #000 }
    table { width: 100%; border-collapse: collapse; font-size: 12px }
    td { padding: 3px 0 }
    td.n { text-align: right; font-variant-numeric: tabular-nums }
    td.i { width: 92px; padding-right: 10px }
    /* Single letters because every one of these is written out in ui.js many
       times over, and the stylesheet rides inside the compressed payload with
       the markup. Measured at 14 bytes; CSS comments like this one are stripped
       before packing, so the legend is free.
         r rule (a ruled-off row)   d dim      w weak      p positive
         h hint (a footer line)     b big      o row (clickable)
         i thumbnail cell (t is taken by the title card)                     */
    tr.o { cursor: pointer }
    tr.o:hover td { background: #ffffff12 }
    .r td { border-top: 1px solid #ffffff26; padding-top: 8px }
    /* One height for every ladder row, whether or not it carries a price tag,
       and every tier sitting on the same line. */
    .g td { height: 44px; vertical-align: bottom }
    .d { color: #8ea6bd }
    .w { color: #64798e }
    .p { color: #8fe0a0 }
    .b { font-size: 17px }
    .h { margin-top: 14px; color: #7d93a9; font-size: 12px; text-align: center }
    button, input {
      background: #24405c; color: #dceaf7; border: 1px solid #ffffff33;
      padding: 3px 10px; font: inherit; cursor: pointer; min-width: 60px
    }
    /* Scoped to the title card, so the shop's own Multiplayer button is spared. */
    .t button { background: none; font: 2em serif; color: #fff }
    button:hover:not(:disabled) { background: #2f5478 }
    button:disabled { opacity: .35; cursor: default }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="flash"></div>
    <div id="hud" class="sh"></div>
    <div id="film" class="sh"></div>
    <div id="roll"></div>
    <div id="vf"></div>
    <div id="track"><div id="bar"></div></div>
    <div id="panel"><div id="card"></div></div>
  </div>
</body>

</html>
