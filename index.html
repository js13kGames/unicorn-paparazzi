<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- No user-scalable=no: maximum-scale=1 already stops the pinch on Android,
       and Safari has ignored both since iOS 10 -- there it is `touch-action:
       none` below and the gesturestart handler in index.js that actually hold
       the zoom off. So it was 17 characters of shell, which is the most
       expensive place in the archive to keep a duplicate. -->
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <!-- No <title> and no theme-color: everything left in the shell is the one
       part of the archive Roadroller never sees -- it has to stay parseable
       HTML -- so it costs close to raw bytes. The title is set from ui.js
       instead, where the same words are already written on the title card and
       cost the packer almost nothing the second time. The tab is nameless for
       the instant before the script runs. Comments here are stripped at build
       time, so saying so is free. -->
  <!-- No theme-color: the shell is the one part of the archive Roadroller never
       sees -- it has to stay parseable HTML -- so its characters cost close to
       raw bytes in the zip. That one meta tag measured 26 of them, which bought
       a tinted address bar on mobile and nothing else. Comments here are
       stripped at build time, so saying so is free. -->
  <!-- GitHub Pages only. docs/ is served as a normal multi-file site, so the
       hosted build can carry a manifest and a service worker that the jam
       archive -- one self-contained index.html with nothing beside it -- cannot.
       Both are stripped in build/pack.mjs before the shell is measured, so they
       cost the zip nothing; the copies they point at are placed in docs/ by
       CopyPlugin. -->
  <link rel="manifest" href="manifest.json">
  <script>navigator.serviceWorker&&addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js"))</script>
  <style>
    /* Deliberately lean: this stylesheet rides inside the compressed payload,
       and unique prose is the one thing the packer cannot squeeze. */
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      touch-action: none; overscroll-behavior: none;
      background: #9ce; color: #fff;
      font: 13px/1.45 ui-monospace, monospace;
    }
    #c { display: block; width: 100vw; height: 100vh; cursor: crosshair }
    #ui { position: fixed; inset: 0; pointer-events: none }
    #ui > * { position: absolute }
    .sh { text-shadow: 0 1px 3px #0009 }
    small { font-size: 11px; opacity: .8 }

    #flash { inset: 0; background: #fff; opacity: 0 }
    #hud { top: 8px; left: 10px }
    #film { top: 8px; right: 10px; text-align: right; font-size: 15px }
    #film b { font-size: 22px }
    #film.low b { color: #f86 }
    #roll {
      top: 60px; right: 10px; width: 84px; bottom: 46px; gap: 4px;
      display: flex; flex-direction: column-reverse; justify-content: flex-end;
      overflow: hidden;
    }
    #roll img { width: 100%; border: 1px solid #fff6; display: block }

    /* The crosshair as two centred gradient strips rather than two pseudo-elements
       with their own position, offsets and content: same 20px cross, far less CSS. */
    #vf {
      border: 1px solid #fff6;
      background: linear-gradient(#fff9, #fff9) center/20px 1px no-repeat,
                  linear-gradient(#fff9, #fff9) center/1px 20px no-repeat;
    }


    #track { left: 10px; right: 10px; bottom: 10px; height: 4px; background: #0004 }
    #bar { height: 100%; width: 0; background: #fff }

    #panel { inset: 0; display: none; place-items: center; background: #a22b; pointer-events: auto }
    #panel.on { display: grid }
    #card {
      width: min(720px, 92vw); max-height: 88vh; overflow: auto; touch-action: pan-y;
      background: #201; border: 1px solid #fff3; padding: 18px 20px
    }
    /* Exactly the viewport, and nothing to scroll. #card is content-box with
       20px of side padding, so the old `width: 100vw` made the title card 40px
       wider than the screen -- and `overflow: auto` then answered that, and any
       column taller than 88vh, with a scrollbar whose gutter pulled the centred
       title and buttons a few pixels off centre. */
    #card.t {
      background: none; border: 0; width: 100%; padding: 0; overflow: visible;
      display: flex; flex-direction: column; align-items: center
    }
    h1 { font: 700 44px serif; margin: 0 0 10px }
    #card.t h1 { font-size: 6em }
    /* Top margin so stacked result cards do not run into each other. */
    h2 { font-size: 14px; margin: 18px 0 12px; font-weight: 400; color: #c97 }
    h1, h2 { text-align: center }
    #card img { width: 100%; display: block; margin-bottom: 12px; background: #000 }
    table { width: 100%; border-collapse: collapse; font-size: 12px }
    td { padding: 3px 0 }
    /* No tabular-nums: the page is set in a monospace face, so digits already line up. */
    td.n { text-align: right }
    td.i { width: 92px; padding-right: 10px }
    /* Single letters because every one of these is written out in ui.js many
       times over, and the stylesheet rides inside the compressed payload with
       the markup. Measured at 14 bytes; CSS comments like this one are stripped
       before packing, so the legend is free.
         r rule (a ruled-off row)   d dim      w weak      p positive
         m minus (a loss, or a multiplier below parity)
         h hint (a footer line)     b big      o row (clickable)
         i thumbnail cell (t is taken by the title card)                     */
    tr.o { cursor: pointer }
    tr.o:hover td { background: #fff1 }
    .r td { border-top: 1px solid #fff3; padding-top: 8px }
    .d { color: #b86 }
    .p { color: #9b6 }
    .b { font-size: 17px }
    .h { margin-top: 14px; color: #a76; font-size: 12px; text-align: center }
    /* After .h, so a footer line can take the loss color: `class="h m"` is a
       hint that is also a problem, and .m has to win the tie. */
    .m { color: #f86 }
    /* One control everywhere: an outline on the panel, filling in on hover. The
       shop used to carry solid #245 buttons while the title card overrode them
       to transparent, which read as two different controls on two screens. The
       inputs are outlined too -- an exception keeping the old solid fill for
       them cost 14 bytes, and the empty box already reads as a field. */
    button, input {
      background: none; color: #fff; border: 1px solid #fff3;
      padding: 10px 16px; font: inherit; cursor: pointer; min-width: 88px
    }
    /* Scoped to the title card, where the buttons are the menu and carry the
       display face the title is set in. */
    .t button { font: 2em serif }
    button:hover:not(:disabled) { background: #533 }
    button:disabled { opacity: .35; cursor: default }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="flash"></div>
    <div id="hud" class="sh"></div>
    <div id="film" class="sh"></div>
    <div id="roll"></div>
    <div id="vf"></div>
    <div id="track"><div id="bar"></div></div>
    <div id="panel"><div id="card"></div></div>
  </div>
</body>

</html>
