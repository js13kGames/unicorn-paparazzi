<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unicorn Snap</title><meta name="theme-color" content="#9ec7f2"><style>body,html{margin:0;height:100%;overflow:hidden;background:#9ec7f2;color:#fff;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}#c{display:block;width:100vw;height:100vh;cursor:crosshair}#ui{position:fixed;inset:0;pointer-events:none}#ui>*{position:absolute}.sh{text-shadow:0 1px 3px #0009}#hud{top:10px;left:12px}#film{top:10px;right:12px;text-align:right;font-size:15px}#film b{font-size:22px}#film.low b{color:#ff8f6b}#zoom{bottom:26px;left:12px}#vf{inset:3vmin;border:1px solid #fff6}#vf::after,#vf::before{content:'';position:absolute;left:50%;top:50%;background:#fff9}#vf::before{width:22px;height:1px;margin-left:-11px}#vf::after{width:1px;height:22px;margin-top:-11px}.cnr{width:26px;height:26px;border:2px solid #fff}.cnr.tl{top:-1px;left:-1px;border-right:0;border-bottom:0}.cnr.tr{top:-1px;right:-1px;border-left:0;border-bottom:0}.cnr.bl{bottom:-1px;left:-1px;border-right:0;border-top:0}.cnr.br{bottom:-1px;right:-1px;border-left:0;border-top:0}#track{left:12px;right:12px;bottom:12px;height:5px;background:#0004;border-radius:3px}#bar{height:100%;width:0;background:#fff;border-radius:3px}#flash{inset:0;background:#fff;opacity:0}#flash.on{opacity:.75;transition:opacity .28s}#panel{inset:0;display:none;place-items:center;background:#0b1a2acc;pointer-events:auto;cursor:pointer}#panel.on{display:grid}#card{width:min(720px,92vw);max-height:88vh;overflow:auto;background:#16273b;border:1px solid #ffffff26;border-radius:6px;padding:20px 22px}#card h1{font-size:19px;margin:0 0 4px;letter-spacing:2px}#card h2{font-size:15px;margin:0 0 12px;font-weight:400;color:#9fb6cc}#card img{width:100%;border-radius:4px;display:block;margin-bottom:14px;background:#000}table{width:100%;border-collapse:collapse;font-size:12px}td{padding:3px 0}td.n{text-align:right;font-variant-numeric:tabular-nums}.rule td{border-top:1px solid #ffffff26;padding-top:8px}.dim{color:#8ea6bd}.pos{color:#8fe0a0}.neg{color:#ff8f6b}.big{font-size:17px}.hint{margin-top:16px;color:#7d93a9;font-size:12px}ul{margin:6px 0 0;padding-left:18px;color:#c3d3e2}</style><script defer="defer" src="main.js"></script></head><body><canvas id="c"></canvas><div id="ui"><div id="hud" class="sh"></div><div id="film" class="sh"></div><div id="zoom" class="sh"></div><div id="vf"><i class="cnr tl"></i><i class="cnr tr"></i><i class="cnr bl"></i><i class="cnr br"></i></div><div id="track"><div id="bar"></div></div><div id="flash"></div><div id="panel"><div id="card"></div></div></div></body></html>
